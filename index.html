<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShowMeYourTDs</title>
<meta name="description" content="Live standings, odds, matchups, and NFL play-by-play tendencies for the ShowMeYourTDs fantasy league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1512;
    --surface: #151F1A;
    --surface-2: #1B2921;
    --line: rgba(237,234,226,0.10);
    --line-strong: rgba(237,234,226,0.18);
    --text: #EDEAE2;
    --text-dim: #93A398;
    --text-faint: #5E6D64;
    --accent: #FF6A2B;
    --accent-soft: rgba(255,106,43,0.14);
    --gold: #FFC93F;
    --good: #4CAF6D;
    --good-soft: rgba(76,175,109,0.14);
    --bad: #E2534B;
    --bad-soft: rgba(226,83,75,0.14);
    --info: #6FA8D8;
    --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
    --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --font-label: "Barlow Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 1200px 500px at 50% -100px, rgba(255,106,43,0.08), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ---- header / scoreboard bar ---- */
  header.board {
    border-bottom: 3px solid var(--accent);
    background: linear-gradient(180deg, rgba(255,106,43,0.07), transparent);
    padding: 28px 20px 18px;
    margin-bottom: 4px;
  }
  .board-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: clamp(34px, 5vw, 52px);
    letter-spacing: 0.02em;
    line-height: 1;
    text-wrap: balance;
  }
  .wordmark span { color: var(--accent); }
  .board-meta {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-family: var(--font-label);
    color: var(--text-dim);
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .board-meta strong {
    color: var(--text);
    font-family: var(--font-mono);
    font-weight: 600;
  }

  /* ---- ticker ---- */
  .ticker {
    display: flex;
    gap: 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-family: var(--font-label);
    font-size: 14px;
  }
  .ticker-item {
    flex: none;
    padding: 10px 22px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
    color: var(--text-dim);
  }
  .ticker-item b { color: var(--gold); font-weight: 600; }

  main { padding-top: 28px; }

  .grid {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .panel.info-accent { border-top-color: var(--info); }
  .panel.gold-accent { border-top-color: var(--gold); }

  .panel h2 {
    font-family: var(--font-display);
    font-size: 21px;
    letter-spacing: 0.03em;
    margin: 0;
    padding: 14px 18px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .panel h2 small {
    font-family: var(--font-label);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .panel-body { padding: 0 18px 18px; }
  .panel-note {
    font-family: var(--font-label);
    font-size: 12.5px;
    color: var(--text-faint);
    padding: 10px 18px 14px;
    border-top: 1px solid var(--line);
    margin-top: 4px;
  }

  table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 13.5px; }
  th {
    white-space: nowrap;
    font-family: var(--font-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .num { font-family: var(--font-mono); }
  .team-cell { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .rank { color: var(--text-faint); font-family: var(--font-mono); width: 1.4em; display: inline-block; }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 3px;
    object-fit: cover;
    flex: none;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
  }
  .avatar.sm { width: 20px; height: 20px; border-radius: 2px; }
  .avatar.lg { width: 40px; height: 40px; border-radius: 4px; }
  .you-flag {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: 0.05em;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 600;
  }
  .table-scroll { overflow-x: auto; }

  .overflow-scroll { overflow-x: auto; }

  /* matchup cards */
  .matchups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .matchup {
    background: var(--surface);
    padding: 14px 16px;
  }
  .matchup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
  }
  .matchup-row .name { font-weight: 500; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .matchup-row .name .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .matchup-row .name.user { color: var(--accent); font-weight: 600; }
  .proj-tag {
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--good);
    background: var(--good-soft);
    border: 1px solid var(--good);
    padding: 1px 5px;
    flex: none;
    white-space: nowrap;
  }
  .matchup-row .pct { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .matchup-row .pts { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
  .matchup-vs {
    text-align: center;
    font-family: var(--font-label);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    padding: 2px 0;
  }
  .win-bar {
    height: 3px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    margin-top: 8px;
  }
  .win-bar > span { display: block; height: 100%; background: var(--accent); }

  /* list rows: performers / injuries / market */
  .list-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .left { min-width: 0; }
  .list-row .primary { font-weight: 500; }
  .list-row .secondary { font-size: 12px; color: var(--text-faint); font-family: var(--font-label); }
  .list-row .val { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
  .pill {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 1px 7px;
    border-radius: 2px;
    font-weight: 600;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: rgba(111,168,216,0.14); color: var(--info); }

  .empty-note {
    color: var(--text-faint);
    font-family: var(--font-label);
    font-size: 13px;
    padding: 12px 0;
  }

  footer {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: var(--font-label);
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--text-dim); text-decoration: underline; text-underline-offset: 2px; }

  .skel { color: var(--text-faint); font-family: var(--font-label); padding: 40px 20px; text-align: center; }

  /* highlights */
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 12px 18px 4px;
  }
  .filter-btn {
    font-family: var(--font-label);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--line-strong);
    padding: 5px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-btn:hover { border-color: var(--text-faint); color: var(--text); }
  .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .highlight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 14px 18px 18px;
  }
  .highlight-card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .highlight-card:hover { border-color: var(--accent); }
  .highlight-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #0a0f0c;
  }
  .highlight-meta { padding: 10px 12px 12px; }
  .highlight-headline {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .highlight-tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .highlight-tags .avatar.sm { margin-right: -2px; }
  .highlight-src {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .recap-strip {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 0 18px 14px;
    font-family: var(--font-label);
    font-size: 12.5px;
  }
  .recap-strip a {
    color: var(--text-dim);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 1px dotted var(--line-strong);
    flex: none;
  }
  .recap-strip a:hover { color: var(--accent); border-color: var(--accent); }

  /* weekly awards */
  .award-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 1px;
  }
  .award-card {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .award-card .label {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .award-card .value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
  .award-card .sub { font-family: var(--font-label); font-size: 12px; color: var(--text-dim); }
  .award-card.best .value { color: var(--good); }
  .award-card.worst .value { color: var(--bad); }

  .position-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .position-card {
    background: var(--surface);
    padding: 14px 12px;
    text-align: center;
  }
  .position-card .pos-label {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .headshot {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    margin: 0 auto 8px;
    display: block;
  }
  .headshot.def {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 16px; color: var(--text-dim);
  }
  .position-card .pname { font-size: 12.5px; font-weight: 500; margin-bottom: 2px; line-height: 1.25; }
  .position-card .ppts { font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--accent); }
  .position-card .powner { font-family: var(--font-label); font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }

  .eff-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .eff-row .eff-name { flex: 0 0 150px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; overflow: hidden; }
  .eff-row .eff-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eff-bar-track { flex: 1; height: 16px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; }
  .eff-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .eff-pct { flex: 0 0 42px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-dim); }
</style>
</head>
<body>


<header class="board">
  <div class="board-inner">
    <div class="wordmark">SHOW ME YOUR <span>TDs</span></div>
    <div class="board-meta">
      <span>WEEK <strong id="m-week">—</strong></span>
      <span><strong id="m-sims">—</strong> SEASON SIMS</span>
      <span id="m-updated"></span>
    </div>
  </div>
</header>

<div class="ticker" id="ticker"></div>

<div class="wrap">
  <main id="main">
    <div class="skel">Loading league data…</div>
  </main>

  <footer>
    <span>Odds: DraftKings via ESPN · Tendencies: nflverse (CC-BY-SA 4.0) · Scores/rosters: Sleeper &amp; ESPN</span>
    <span id="f-updated"></span>
  </footer>
</div>

<script>
async function main() {
  let data;
  try {
    const res = await fetch('data.json', {cache: 'no-store'});
    data = await res.json();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="skel">Could not load data.json — publish it alongside this page.</div>';
    return;
  }
  render(data);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(n) { return (n === null || n === undefined) ? '—' : n.toFixed(0) + '%'; }
function pct1(n) { return (n === null || n === undefined) ? '—' : n.toFixed(1) + '%'; }

let TEAMS = {};
function teamName(key) { return (TEAMS[key] && TEAMS[key].team_name) || key; }
function teamHandle(key) { return (TEAMS[key] && TEAMS[key].handle) || key; }
function avatarImg(key, size) {
  const url = TEAMS[key] && TEAMS[key].avatar;
  const cls = size ? ' ' + size : '';
  if (!url) return `<span class="avatar${cls}" aria-hidden="true"></span>`;
  return `<img class="avatar${cls}" src="${esc(url)}" alt="" loading="lazy">`;
}
function teamLabel(key, size) {
  return `${avatarImg(key, size)}<span class="tn">${esc(teamName(key))}</span>`;
}

function render(data) {
  TEAMS = data.teams || {};
  document.getElementById('m-week').textContent = data.week;
  document.getElementById('m-sims').textContent = data.sims.toLocaleString();
  const now = new Date().toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
  document.getElementById('m-updated').textContent = 'UPDATED ' + now.toUpperCase();
  document.getElementById('f-updated').textContent = 'Page generated ' + now;

  renderTicker(data);

  const s = data.standings || [];
  const leader = s[0];
  const user = s.find(r => r.is_user);

  document.getElementById('main').innerHTML = `
    <div class="grid">
      <section class="panel">
        <h2>Standings &amp; Odds <small>${data.sims.toLocaleString()} sims</small></h2>
        <div class="panel-body table-scroll">
          ${standingsTable(s)}
        </div>
      </section>
      <section class="panel gold-accent">
        <h2>Storylines</h2>
        <div class="panel-body">
          ${storylines(data)}
        </div>
      </section>
    </div>

    <section class="panel" style="margin-bottom:20px;">
      <h2>Week ${data.week} Matchups <small>model-projected win% &amp; score</small></h2>
      <div class="panel-body">
        ${matchupCards(data.matchups, data.user_team)}
      </div>
    </section>

    ${weeklyAwardsSection(data.weekly_awards)}

    <section class="panel" style="margin-bottom:20px;">
      <h2>Highlights <small>via ESPN</small></h2>
      ${recapStrip(data.recaps)}
      <div class="filter-row" id="hl-filters"></div>
      <div class="highlight-grid" id="hl-grid"></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Team Tendencies <small>${data.tendencies ? 'nflverse play-by-play, wk ' + data.tendencies.weeks.join('-') : ''}</small></h2>
        <div class="panel-body table-scroll">
          ${tendenciesTable(data.tendencies)}
        </div>
        ${data.tendencies && data.tendencies.weeks.length < 4 ? '<div class="panel-note">Provisional — only ' + data.tendencies.weeks.length + ' week(s) of plays. Small samples, treat with caution.</div>' : ''}
      </section>
      <section class="panel info-accent">
        <h2>Market Watch</h2>
        <div class="panel-body">
          ${marketList(data.market)}
        </div>
      </section>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Top Performers <small>this week</small></h2>
        <div class="panel-body">
          ${performersList(data.top_performers)}
        </div>
      </section>
      <section class="panel">
        <h2>Injury Report</h2>
        <div class="panel-body">
          ${injuriesList(data.injuries)}
        </div>
      </section>
    </div>
  `;

  initHighlights(data.highlights || []);
}

function headshot(pid, pos) {
  if (pos === 'DEF') {
    return `<div class="headshot def">${esc(pid)}</div>`;
  }
  return `<img class="headshot" src="https://sleepercdn.com/content/nfl/players/${esc(pid)}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
}

function positionCard(entry) {
  if (!entry) return '';
  return `<div class="position-card">
    <div class="pos-label">${esc(entry.pos)}</div>
    ${headshot(entry.pid, entry.pos)}
    <div class="pname">${esc(entry.name)}</div>
    <div class="ppts">${entry.pts.toFixed(1)}</div>
    <div class="powner">${teamLabel(entry.team, 'sm')}</div>
  </div>`;
}

function weeklyAwardsSection(a) {
  if (!a || !a.week) return '';
  const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
  const potw = POS_ORDER.map(p => a.players_of_week[p]).filter(Boolean);
  const bench = POS_ORDER.map(p => a.benchwarmers_of_week[p]).filter(Boolean);
  return `
    <section class="panel gold-accent" style="margin-bottom:20px;">
      <h2>Week ${a.week} Awards</h2>
      <div class="award-cards">
        <div class="award-card best">
          <div>
            <div class="label">Best Team</div>
            <div class="value">${a.best_team.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.best_team.team)}</div>
          </div>
        </div>
        <div class="award-card worst">
          <div>
            <div class="label">Worst Team</div>
            <div class="value">${a.worst_team.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.worst_team.team)}</div>
          </div>
        </div>
        <div class="award-card">
          <div>
            <div class="label">Most Efficient</div>
            <div class="value">${a.most_efficient.efficiency}%</div>
            <div class="sub">${teamName(a.most_efficient.team)}</div>
          </div>
        </div>
        <div class="award-card">
          <div>
            <div class="label">Least Efficient</div>
            <div class="value">${a.least_efficient.efficiency}%</div>
            <div class="sub">${teamName(a.least_efficient.team)}</div>
          </div>
        </div>
        ${a.highest_pts_in_loss ? `<div class="award-card">
          <div>
            <div class="label">Highest Pts in a Loss</div>
            <div class="value">${a.highest_pts_in_loss.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.highest_pts_in_loss.team)}</div>
          </div>
        </div>` : ''}
        ${a.lowest_pts_in_win ? `<div class="award-card">
          <div>
            <div class="label">Lowest Pts in a Win</div>
            <div class="value">${a.lowest_pts_in_win.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.lowest_pts_in_win.team)}</div>
          </div>
        </div>` : ''}
      </div>
      <div class="panel-body" style="padding-top:18px;">
        <h2 style="padding:0 0 10px;font-size:17px;">Players of the Week</h2>
        <div class="position-grid" style="margin-bottom:20px;">
          ${potw.map(positionCard).join('')}
        </div>
        <h2 style="padding:0 0 10px;font-size:17px;">Benchwarmers of the Week</h2>
        <div class="position-grid" style="margin-bottom:20px;">
          ${bench.map(positionCard).join('')}
        </div>
        <h2 style="padding:0 0 10px;font-size:17px;">Lineup Efficiency <small style="font-family:var(--font-label);font-size:12px;color:var(--text-faint);">actual starters vs. best possible lineup</small></h2>
        ${a.efficiency_rank.map(r => `<div class="eff-row">
          <div class="eff-name">${teamLabel(r.team, 'sm')}</div>
          <div class="eff-bar-track"><div class="eff-bar-fill" style="width:${r.efficiency}%"></div></div>
          <div class="eff-pct">${r.efficiency}%</div>
        </div>`).join('')}
      </div>
    </section>`;
}

function recapStrip(recaps) {
  if (!recaps || !recaps.length) return '';
  return `<div class="recap-strip">${recaps.filter(r => r.link).map(r =>
    `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.headline || r.game)}</a>`
  ).join('')}</div>`;
}

function initHighlights(highlights) {
  const owners = [...new Set(highlights.flatMap(h => h.owners || []))]
    .sort((a, b) => teamName(a).localeCompare(teamName(b)));
  const filters = document.getElementById('hl-filters');
  const grid = document.getElementById('hl-grid');
  if (!filters || !grid) return;

  let active = 'all';
  function draw() {
    filters.innerHTML = [
      `<button class="filter-btn ${active==='all'?'active':''}" data-f="all">All plays</button>`,
      ...owners.map(o => `<button class="filter-btn ${active===o?'active':''}" data-f="${esc(o)}">${teamLabel(o,'sm')}</button>`)
    ].join('');
    const shown = active === 'all' ? highlights : highlights.filter(h => (h.owners||[]).includes(active));
    grid.innerHTML = shown.length ? shown.map(highlightCard).join('') :
      '<div class="empty-note">No highlights tagged to this team yet.</div>';
    filters.querySelectorAll('.filter-btn').forEach(b => {
      b.addEventListener('click', () => { active = b.dataset.f; draw(); });
    });
  }
  draw();
}

function highlightCard(h) {
  const tags = (h.owners || []).map(o => avatarImg(o, 'sm')).join('');
  const thumb = h.thumbnail ? `<img class="highlight-thumb" src="${esc(h.thumbnail)}" alt="" loading="lazy">`
                             : '<div class="highlight-thumb"></div>';
  return `<a class="highlight-card" href="${esc(h.video_url)}" target="_blank" rel="noopener">
    ${thumb}
    <div class="highlight-meta">
      <div class="highlight-headline">${esc(h.headline)}</div>
      <div class="highlight-tags">${tags}<span class="highlight-src">${esc(h.game || '')}</span></div>
    </div>
  </a>`;
}

function renderTicker(data) {
  const items = [];
  const s = data.standings || [];
  if (s[0]) items.push(`#1 seed pace: <b>${esc(teamName(s[0].team))}</b> (${pct(s[0].playoff_pct)} playoffs)`);
  const closest = [...(data.matchups||[])].sort((a,b) => Math.abs(a.a_winpct-50) - Math.abs(b.a_winpct-50))[0];
  if (closest) items.push(`Closest game: <b>${esc(teamName(closest.a))}</b> vs <b>${esc(teamName(closest.b))}</b> (${closest.a_winpct}/${closest.b_winpct})`);
  const t = data.tendencies;
  if (t && t.teams && t.teams.length) {
    const mostPass = [...t.teams].sort((a,b) => (b.xpass_residual||-1)-(a.xpass_residual||-1))[0];
    if (mostPass) items.push(`Most pass-heavy vs expected (NFL): <b>${esc(mostPass.team)}</b> (${(mostPass.xpass_residual*100).toFixed(0)}%)`);
  }
  const mv = (data.market && data.market.lines) ? Object.values(data.market.lines) : [];
  items.push(`Betting lines tracked: <b>${Object.keys(data.market && data.market.lines || {}).length / 2 | 0 || (mv.length ? Math.ceil(mv.length/2) : 0)}</b> games this week`);
  document.getElementById('ticker').innerHTML = items.map(i => `<div class="ticker-item">${i}</div>`).join('');
}

function standingsTable(rows) {
  if (!rows.length) return '<div class="empty-note">No standings data yet.</div>';
  return `<table>
    <thead><tr>
      <th>Team</th><th>Rec (proj)</th><th>Actual</th><th>PF</th><th>Playoff</th><th>Bye</th><th>Title</th><th>FAAB</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td><span class="team-cell"><span class="rank">${r.rank}</span>${teamLabel(r.team)}${r.is_user ? '<span class="you-flag">YOU</span>' : ''}</span></td>
        <td class="num">${r.proj_w}-${r.proj_l}</td>
        <td class="num">${r.actual_w}-${r.actual_l}</td>
        <td class="num">${r.pf.toFixed(1)}</td>
        <td class="num">${pct1(r.playoff_pct)}</td>
        <td class="num">${pct1(r.bye_pct)}</td>
        <td class="num">${pct1(r.title_pct)}</td>
        <td class="num">$${r.faab}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function matchupCards(matchups, userTeam) {
  if (!matchups || !matchups.length) return '<div class="empty-note">No matchups posted yet.</div>';
  return `<div class="matchups">
    ${matchups.map(m => {
      const aUser = m.a === userTeam, bUser = m.b === userTeam;
      const aWinner = m.a_winpct >= m.b_winpct;
      const tie = m.a_winpct === m.b_winpct;
      return `<div class="matchup">
        <div class="matchup-row">
          <span class="name ${aUser?'user':''}">${teamLabel(m.a,'sm')}${aWinner && !tie ? '<span class="proj-tag">PROJ. WIN</span>' : ''}</span>
          <span class="pts">${m.a_pts}</span>
        </div>
        <div class="matchup-row"><span class="pct">${m.a_winpct}% win</span><span class="pct">${m.b_winpct}% win</span></div>
        <div class="win-bar"><span style="width:${m.a_winpct}%"></span></div>
        <div class="matchup-vs">VS</div>
        <div class="matchup-row">
          <span class="name ${bUser?'user':''}">${teamLabel(m.b,'sm')}${!aWinner && !tie ? '<span class="proj-tag">PROJ. WIN</span>' : ''}</span>
          <span class="pts">${m.b_pts}</span>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function tendenciesTable(t) {
  if (!t || !t.teams || !t.teams.length) return '<div class="empty-note">Run tendencies.py to populate this.</div>';
  const rows = [...t.teams].sort((a,b) => b.epa_per_play_off - a.epa_per_play_off);
  return `<table>
    <thead><tr>
      <th>Team</th><th>EPA/play (off)</th><th>EPA/play (def)</th><th>Pass rate</th><th>xPass +/-</th><th>Shotgun</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td>${esc(r.team)}</td>
        <td class="num">${r.epa_per_play_off.toFixed(2)}</td>
        <td class="num">${(r.epa_per_play_def||0).toFixed(2)}</td>
        <td class="num">${pct(r.pass_rate*100)}</td>
        <td class="num">${r.xpass_residual!==null ? (r.xpass_residual>0?'+':'')+(r.xpass_residual*100).toFixed(0)+'%' : '—'}</td>
        <td class="num">${pct(r.shotgun_rate*100)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function marketList(market) {
  const lines = (market && market.lines) ? market.lines : {};
  const seen = new Set();
  const games = [];
  for (const [team, l] of Object.entries(lines)) {
    const key = [team, l.opp].sort().join('-');
    if (seen.has(key)) continue;
    seen.add(key);
    const fav = l.spread < 0 ? team : l.opp;
    const dogSpread = Math.abs(l.spread);
    games.push({away: l.home ? l.opp : team, home: l.home ? team : l.opp, fav, spread: dogSpread,
               total: l.total, kickoff: l.kickoff});
  }
  if (!games.length) return '<div class="empty-note">No games with a posted line right now.</div>';
  games.sort((a, b) => (a.kickoff || '9999') < (b.kickoff || '9999') ? -1 : 1);
  const next = games[0];
  return games.map(g => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(g.away)} @ ${esc(g.home)} ${g === next ? '<span class="pill info">NEXT UP</span>' : ''}</div>
      <div class="secondary">${esc(g.fav)} favored${kickoffLabel(g.kickoff)}</div>
    </div>
    <div class="val">-${g.spread} · O/U ${g.total}</div>
  </div>`).join('');
}

function kickoffLabel(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return ' · ' + d.toLocaleString('en-US', {weekday:'short', hour:'numeric', minute:'2-digit', timeZoneName:'short'});
}

function performersList(list) {
  if (!list || !list.length) return '<div class="empty-note">No games played yet this week.</div>';
  return list.map(p => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(p.name)} <span class="secondary">${esc(p.team)}</span></div>
      <div class="secondary" style="display:flex;align-items:center;gap:5px;">${p.owner ? teamLabel(p.owner,'sm') : 'free agent'}</div>
    </div>
    <div class="val">${p.pts.toFixed(1)}</div>
  </div>`).join('');
}

function injuriesList(list) {
  if (!list || !list.length) return '<div class="empty-note">No injuries reported this week.</div>';
  return list.map(i => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(i.player)} <span class="secondary">${esc(i.team)}</span></div>
      <div class="secondary">${esc(i.type || '')}${i.owner ? ' · ' + esc(teamName(i.owner)) : ''}</div>
    </div>
    <span class="pill ${i.status === 'Out' || i.status === 'Doubtful' ? 'bad' : 'info'}">${esc(i.status || '')}</span>
  </div>`).join('');
}

function storylines(data) {
  const items = [];
  const s = data.standings || [];
  const user = s.find(r => r.is_user);
  if (user) items.push(`<b>${esc(teamName(user.team))}</b> sits ${user.rank}${ordinal(user.rank)} at ${pct1(user.playoff_pct)} to make the playoffs.`);
  const leader = s[0];
  if (leader) items.push(`<b>${esc(teamName(leader.team))}</b> leads the field at ${pct1(leader.title_pct)} title odds.`);
  const t = data.tendencies;
  if (t && t.teams && t.teams.length) {
    const best = [...t.teams].sort((a,b)=>b.epa_per_play_off-a.epa_per_play_off)[0];
    items.push(`<b>${esc(best.team)}</b> leads the league in offensive EPA/play (${best.epa_per_play_off.toFixed(2)}) so far.`);
  }
  if (!items.length) return '<div class="empty-note">Check back once more of the week has played.</div>';
  return items.map(i => `<div class="list-row" style="border:none;padding:9px 0 9px;line-height:1.45;">${i}</div>`).join('');
}

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v-20)%10] || s[v] || s[0];
}

main();
</script>

</body>
</html>
